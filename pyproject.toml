[project]
name = "solo-social-ai"
version = "0.1.0"
description = "AI-powered weekly social media marketing assistant for solo founders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "sqlalchemy>=2.0.31",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "openai>=1.44.0",
  "pytest>=8.3.2",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
